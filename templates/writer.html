<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcadAI Writer Pro</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#eef2f7;
color:#111827;
}

.header{
height:72px;
background:#fff;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 32px;
border-bottom:1px solid #e5e7eb;
position:sticky;
top:0;
z-index:10;
}

.logo{
font-size:25px;
font-weight:bold;
color:#2563eb;
}

.container{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

.panel{
background:#fff;
border-radius:18px;
padding:28px;
box-shadow:0 6px 25px rgba(0,0,0,.06);
margin-bottom:25px;
}

textarea{
width:100%;
height:160px;
padding:18px;
font-size:16px;
border:1px solid #d1d5db;
border-radius:12px;
resize:vertical;
}

.options{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;
margin-top:20px;
}

label{
font-weight:bold;
display:block;
margin-bottom:8px;
}

select{
width:100%;
padding:13px;
border-radius:10px;
border:1px solid #d1d5db;
}

.templates{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:14px;
margin-top:10px;
}

.template{
border:2px solid #e5e7eb;
border-radius:14px;
padding:18px;
cursor:pointer;
text-align:center;
transition:.2s;
}

.template:hover{
border-color:#2563eb;
}

.template.active{
border-color:#2563eb;
background:#eff6ff;
}

.generate{
width:100%;
margin-top:22px;
padding:17px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.generate:disabled{
opacity:.6;
}

.loading{
background:white;
padding:35px;
border-radius:18px;
text-align:center;
}

.project-page{
width:210mm;
min-height:297mm;
background:white;
margin:25px auto;
padding:25mm;
box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.cover{
display:flex;
align-items:center;
justify-content:center;
text-align:center;
flex-direction:column;
}

.page-content{
font-size:18px;
line-height:2;
white-space:pre-wrap;
text-align:justify;
}

@media(max-width:800px){
.options{grid-template-columns:1fr}
.project-page{width:100%;min-height:auto}
}
</style>
</head>

<body>

<header class="header">
<div class="logo">✦ AcadAI</div>
<div>Writer Pro</div>
</header>

<main class="container">

<section class="panel">

<h1>أنشئ مشروعًا احترافيًا بالذكاء الاصطناعي</h1>

<p>
اكتب فكرتك، واختر القالب وعدد الصفحات، وسيقوم AcadAI ببناء المشروع كاملًا.
</p>

<textarea id="prompt" placeholder="مثال: أنشئ لي بحثًا جامعيًا عن الطاقة الشمسية..."></textarea>

<div class="options">

<div>
<label>عدد الصفحات</label>
<select id="pageCount">
<option value="5">5 صفحات</option>
<option value="10">10 صفحات</option>
<option value="20">20 صفحة</option>
<option value="30">30 صفحة</option>
<option value="50">50 صفحة</option>
<option value="75">75 صفحة</option>
<option value="100">100 صفحة</option>
</select>
</div>

<div>
<label>نوع المشروع</label>
<select id="projectType">
<option>بحث جامعي</option>
<option>مذكرة تخرج</option>
<option>تقرير</option>
<option>Exposé</option>
<option>مشروع تقني</option>
</select>
</div>

</div>

<h3>اختر القالب</h3>

<div class="templates">

<div class="template active" data-template="academic">🎓 أكاديمي</div>
<div class="template" data-template="scientific">🔬 علمي</div>
<div class="template" data-template="thesis">📖 مذكرة</div>
<div class="template" data-template="business">💼 Business</div>
<div class="template" data-template="creative">🎨 إبداعي</div>
<div class="template" data-template="technical">💻 تقني</div>

</div>

<button class="generate" id="generateBtn">
✨ إنشاء المشروع
</button>

</section>

<div id="result"></div>

</main>

<script>

let selectedTemplate="academic";

document.querySelectorAll(".template").forEach(card=>{
card.addEventListener("click",()=>{
document.querySelectorAll(".template").forEach(c=>c.classList.remove("active"));
card.classList.add("active");
selectedTemplate=card.dataset.template;
});
});

const generateBtn=document.getElementById("generateBtn");
const result=document.getElementById("result");

generateBtn.addEventListener("click",async()=>{

const prompt=document.getElementById("prompt").value.trim();
const pageCount=document.getElementById("pageCount").value;
const projectType=document.getElementById("projectType").value;

if(!prompt){
alert("اكتب طلبك أولًا");
return;
}

generateBtn.disabled=true;
generateBtn.textContent="⏳ AcadAI يعمل على مشروعك...";

result.innerHTML=`
<div class="loading">
<h2>✦ AcadAI ينشئ مشروعك</h2>
<p>جاري بناء الهيكل...</p>
<p>جاري كتابة المحتوى...</p>
<p>جاري تنسيق الصفحات...</p>
</div>`;

try{

const response=await fetch("/generate",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
prompt,
page_count:pageCount,
project_type:projectType,
template:selectedTemplate
})
});

const data=await response.json();

if(data.error) throw new Error(data.error);

renderProject(data.project);

}catch(error){

result.innerHTML=`<div class="loading"><h2>خطأ</h2><p>${error.message}</p></div>`;

}

generateBtn.disabled=false;
generateBtn.textContent="✨ إنشاء المشروع";

});

function renderProject(project){

let html=`<h2>${project.project_title||"مشروع جديد"}</h2>`;

(project.pages||[]).forEach((page,index)=>{

html+=`<section class="project-page ${page.page_type==="cover"?"cover":""}">
<h1>${page.title||""}</h1>
${page.subtitle?`<h2>${page.subtitle}</h2>`:""}
<div class="page-content">${String(page.content||"").replace(/\n/g,"<br>")}</div>
</section>`;

});

result.innerHTML=html;

}

</script>

</body>
</html>
